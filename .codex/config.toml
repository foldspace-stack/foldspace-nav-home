[skills]
enabled = true
directory = ".agents/skills"  


# 确保总是包含DESIGN.md文件
project_doc_includes = ["DESIGN.md", "AGENTS.md"]
# 避免生成设计系统文档时，因为上下文限制而被截断
project_doc_max_bytes = 32768

# 如果项目很大，可以配置排除不必要的大文件以节省上下文
exclude = [
    "**/node_modules/**",
    "**/dist/**",
    "**/*.log",
    "**/*.test.js",
]

[mcp_servers.chrome-devtools]
command = "env"
args = [
    "-u", "http_proxy",
    "-u", "https_proxy",
    "-u", "HTTP_PROXY",
    "-u", "HTTPS_PROXY",
    "-u", "ALL_PROXY",
    "-u", "all_proxy",
    "-u", "npm_config_proxy",
    "-u", "npm_config_https_proxy",
    "-u", "npm_config_http_proxy",
    "-u", "npm_config_all_proxy",
    "-u", "NO_PROXY",
    "-u", "no_proxy",
    "npx",
    "-y",
    "chrome-devtools-mcp@latest",
    "--browserUrl=http://127.0.0.1:9222",
    "--no-usage-statistics",
    "--no-performance-crux"
]

[mcp_servers.chrome-devtools.tools.navigate_page]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.take_snapshot]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.evaluate_script]
approval_mode = "approve"

[mcp_servers.chrome-devtools.tools.new_page]
approval_mode = "approve"
